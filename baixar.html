<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Baixar o Bibluno na Google Play</title>
    <!-- Endereço curto do código QR da home e de peças impressas: leva à loja com a origem
         da instalação (docs/09, "Links com UTM"). Sem rastreador aqui. -->

    <meta name="theme-color" content="#1A7CF2" />
    <meta name="color-scheme" content="light" />
    <meta

      content="0; url=https://play.google.com/store/apps/details?id=app.bibluno.mobile&amp;referrer=utm_source%3Dsite%26utm_medium%3Dqr%26utm_campaign%3Dbaixar"

  <body>
    <main id="conteudo" class="container not-found">
      <div class="blu-stage" aria-hidden="true">
        <img src="/img/blu-happy.webp" alt="" width="291" height="360" />
      </div>
      <h1 class="t-title">Abrindo a Google Play…</h1>
      <p class="lead">Se a loja não abrir sozinha, toque no botão.</p>
      <a
        class="btn btn-primary"
        href="https://play.google.com/store/apps/details?id=app.bibluno.mobile&amp;referrer=utm_source%3Dsite%26utm_medium%3Dqr%26utm_campaign%3Dbaixar"
